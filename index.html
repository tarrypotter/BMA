rea id="nivbulk" class="field" rows="5" placeholder="A1&#9;NIV verse text..."></textarea><button class="btn small secondary" data-action="nivpaste" style="margin-top:10px">붙여넣은 본문 등록</button></details><p class="hint" id="nivprogress">NIV 등록 현황: ${VERSES.filter(v=>getText(v,'en')).length}/60구절</p><button class="btn secondary full" data-action="precache">한국어 60구절 전체 오프라인 저장</button><p id="cacheprogress" class="hint">저장된 본문: ${Object.keys(state.cache).length}개 (영어 NIV는 직접 등록)</p><div class="notice">인터넷 연결은 본문을 처음 가져올 때 필요합니다. 완전한 오프라인 사용을 원한다면 위 버튼으로 본문을 저장한 뒤 ZIP 앱으로 배포하세요. 알림은 앱을 열 때 확인하는 방식이며, 기기가 꺼져 있을 때 푸시 알림을 보내지는 않습니다.</div></div>`}

// Expanded quiz laboratory. All local-only state; previous verse progress is preserved.
let labOrder=[],labPick='',labReveal=false,labResult=null,labTotal=0,labCorrect=0,labMistakes=[],labOptions={count:'all',level:'normal'};
const LAB_MODES=['write','blank','reference','order','initial','keyword','truefalse','flash','mixed'];
function labMode(){return testMode==='mixed'?['order','initial','keyword','truefalse','flash','write','reference','blank'][quizPos%8]:testMode}
function labWords(s){return (s||'').trim().split(/\s+/).filter(Boolean)}
function labReset(){labOrder=[];labPick='';labReveal=false;labResult=null;labTotal=0;labCorrect=0;labMistakes=[]}
function labNext(){labOrder=[];labPick='';labReveal=false;labResult=null;lastAnswer='';quizChoice=null;blankAnswers={};testResult=null;reveal=false;practiceNonce++;if(quizPos<quizQueue.length-1)quizPos++;else quizPos=quizQueue.length;render();examScroll()}
function labPool(){let available=availableVerses();if(testScope==='weak')available=VERSES.filter(v=>getText(v,testLang())&&(state.quizErrors?.[v.id]||0)>0);if(testScope==='learned')available=VERSES.filter(v=>getText(v,testLang())&&state.learned[v.id]);return available}
function labStart(){
 let pool=labPool();
 if(!pool.length && testLang()==='ko'){
   let english=VERSES.filter(v=>(testScope==='all'||testScope==='today'&&v.id===VERSES[todayIndex()].id||testScope===v.topic||testScope==='weak'&&(state.quizErrors?.[v.id]||0)>0||testScope==='learned'&&state.learned[v.id])&&!!getText(v,'en'));
   if(english.length){state.language='en';save();pool=labPool();toast('한국어 본문이 아직 없어 NIV 영어 시험으로 전환했어요.');}
 }
 quizQueue=shuffled(pool).slice(0,labOptions.count==='all'?undefined:Number(labOptions.count)).map(v=>v.id);
 quizPos=0;labReset();render();
 if(quizQueue.length)examScroll();
 if(!quizQueue.length)toast('출제 가능한 구절이 없습니다. 다른 범위 또는 언어를 선택해 주세요.');
}
function examScroll(){requestAnimationFrame(()=>document.getElementById('exam-stage')?.scrollIntoView({behavior:'auto',block:'start'}))}
function labTitle(m){return ({order:'단어 순서 배열',initial:'첫 글자 힌트',keyword:'핵심 단어',truefalse:'O / X 판단',flash:'플래시카드',mixed:'종합 랜덤',write:'전문 암송',reference:'구절 위치',blank:'빈칸 채우기'})[m]||m}
function labChunks(s){let w=labWords(s);let n=Math.min(8,Math.max(2,Math.ceil(w.length/5)));let chunks=[];for(let i=0;i<w.length;i+=n)chunks.push(w.slice(i,i+n).join(' '));return chunks}
function labQuestion(v,m){const s=getText(v,testLang())||'',w=labWords(s);if(m==='order'){
 let chunks=labChunks(s);if(!labOrder.length)labOrder=shuffled(chunks).map((t,i)=>({text:t,key:i}));return `<p class="hint">아래 문장 조각을 올바른 순서로 눌러 배열하세요.</p><div class="result" style="min-height:65px">${labOrder.filter(x=>x.used).sort((a,b)=>a.rank-b.rank).map(x=>`<button class="btn small secondary" data-action="labundo" data-i="${x.key}" style="margin:3px">${esc(x.text)}</button>`).join('')||'여기를 문장 조각으로 채워주세요'}</div><div class="row" style="margin-top:14px">${labOrder.filter(x=>!x.used).map(x=>`<button class="btn secondary small" data-action="labchunk" data-i="${x.key}">${esc(x.text)}</button>`).join('')}</div>`}
 if(m==='initial'){let mask=w.map(t=>t.replace(/[\p{L}\p{N}]/gu,(ch,i)=>i===0?ch:'_')).join(' ');return `<p class="hint">각 단어의 첫 글자만 보고 본문 전체를 떠올려 보세요.</p><div class="verse" style="font-size:16px;overflow-wrap:anywhere;letter-spacing:1px">${esc(mask)}</div><textarea id="labAnswer" class="field" placeholder="기억나는 전체 말씀을 입력하세요"></textarea>`}
 if(m==='keyword'){let a=w.filter(x=>normalize(x).length>3);let targets=[...new Set(a)].sort((x,y)=>hashStr(v.id+':'+x)-hashStr(v.id+':'+y)).slice(0,Math.min(4,a.length));if(!targets.length)targets=w.slice(0,2);window.labKeywords=targets;return `<p class="hint">다음 주요 단어들을 모두 포함하도록 말씀을 암송하세요.</p><div class="row">${targets.map(x=>`<span class="pill">${esc(x)}</span>`).join('')}</div><textarea id="labAnswer" class="field" style="margin-top:15px" placeholder="구절 전체를 기억나는 대로 적으세요"></textarea>`}
 if(m==='truefalse'){let falseVerse=VERSES.find(x=>x.id!==v.id&&getText(x,testLang())&&x.topic===v.topic)||VERSES.find(x=>x.id!==v.id&&getText(x,testLang()));let truth=hashStr(v.id+quizPos)%2===0;window.labTruth=truth;return `<p class="hint">아래 말씀이 <b>${esc(v.ref)}</b>에 해당할까요?</p><div class="verse" style="font-size:17px">${esc(truth?s:getText(falseVerse,testLang()))}</div><div class="row" style="margin-top:15px"><button class="btn ${labPick==='yes'?'':'secondary'} grow" data-action="labpick" data-pick="yes">⭕ 맞다</button><button class="btn ${labPick==='no'?'':'secondary'} grow" data-action="labpick" data-pick="no">❌ 아니다</button></div>`}
 if(m==='flash')return `<p class="hint">실물 암송카드처럼 먼저 성경 위치만 보고 암송한 뒤 카드를 뒤집어 확인하세요.</p><button class="btn full secondary" data-action="labflip" style="min-height:170px;line-height:1.8;white-space:normal">${labReveal?esc(s):'📖 '+esc(v.ref)+'\n카드를 눌러 뒤집기'}</button><div class="row" style="margin-top:15px"><button class="btn secondary grow" data-action="labself" data-point="0">다시 외우기</button><button class="btn grow" data-action="labself" data-point="100">외웠어요 ✓</button></div>`;
 return ''}
function showAdvancedTest(){let lang=testLang(),available=labPool(),v=quizQueue.length&&quizPos<quizQueue.length?quizVerse():null,m=labMode(),done=quizQueue.length&&quizPos>=quizQueue.length;return `<div class="section"><h2>🧠 암송 훈련 연구소</h2><small>다양한 시험</small></div><div class="card"><label class="hint">출제 범위</label><select id="testscope" class="field"><option value="today" ${testScope==='today'?'selected':''}>오늘의 구절</option>${Object.keys(TOPICS).map(t=>`<option value="${t}" ${testScope===t?'selected':''}>${t} · ${TOPICS[t]}</option>`).join('')}<option value="all" ${testScope==='all'?'selected':''}>전체 60구절 랜덤</option><option value="weak" ${testScope==='weak'?'selected':''}>오답만 다시 풀기</option><option value="learned" ${testScope==='learned'?'selected':''}>학습 완료 구절만</option></select><p class="hint">시험 유형</p><div class="quizmodegrid">${[['write','전문 암송'],['blank','빈칸'],['reference','구절 위치'],['order','순서 배열'],['initial','첫 글자'],['keyword','키워드'],['truefalse','O / X'],['flash','플래시카드'],['mixed','종합 랜덤']].map(([k,n])=>`<button class="btn small ${testMode===k?'':'secondary'}" data-action="testmode" data-value="${k}">${n}</button>`).join('')}</div><div class="row" style="margin-top:14px"><button class="btn small ${lang==='ko'?'':'secondary'}" data-action="testlang" data-lang="ko">한국어</button><button class="btn small ${lang==='en'?'':'secondary'}" data-action="testlang" data-lang="en">NIV 영어</button><select class="field" id="labcount" style="flex:1;min-width:125px"><option value="all" ${labOptions.count==='all'?'selected':''}>전체 문제</option>${[5,10,20,30].map(n=>`<option ${labOptions.count==n?'selected':''} value="${n}">${n}문제</option>`).join('')}</select></div><button class="btn full" data-action="labstart" style="margin-top:13px">${quizQueue.length?"↻ 처음부터 다시 시작":"▶ 시험 시작"}</button><p class="hint">출제 가능 ${available.length}구절 · 오답 문제는 자동 저장돼요.</p></div>${done?`<div class="card" id="exam-stage"><h2>🎉 시험 완료!</h2><div class="statrow"><div class="stat"><strong>${labTotal}</strong><small>응시 문제</small></div><div class="stat"><strong>${labCorrect}</strong><small>정답</small></div><div class="stat"><strong>${labTotal?Math.round(labCorrect/labTotal*100):0}%</strong><small>정답률</small></div></div><button class="btn full" data-action="labretry" style="margin-top:16px">오답 위주 다시 풀기</button><button class="btn secondary full" data-action="labstart" style="margin-top:9px">↻ 새 시험 시작</button></div>`:v?`<div class="card" id="exam-stage"><div class="row" style="justify-content:space-between"><span class="tag">${quizPos+1} / ${quizQueue.length} 문제</span><span class="pill">${labTitle(m)}</span></div><div class="meter" style="background:#edf1eb;margin:15px 0"><i style="background:var(--main);width:${quizPos/quizQueue.length*100}%"></i></div><h2 class="ref">${esc(v.ref)} <small style="font-size:13px;color:var(--muted)">${v.id}</small></h2>${['write','blank','reference'].includes(m)?labLegacy(v,m):labQuestion(v,m)}${labResult!==null?`<div class="result"><strong>${labResult}점</strong><p>${esc(getText(v,lang)||'')}</p></div>`:''}${m!=='flash'?`<button class="btn full" data-action="labgrade" style="margin-top:17px" ${labResult!==null?'disabled':''}>정답 확인 · 채점</button>`:''}<button class="btn secondary full" data-action="labnext" style="margin-top:9px">${quizPos===quizQueue.length-1?'결과 확인':'다음 문제 →'}</button><button class="btn secondary full" data-action="labstart" style="margin-top:9px">↻ 시험 처음부터 다시 시작</button></div>`:`<div class="card empty">시험 유형과 범위를 정하고 시작해 주세요.${!available.length?'<p>이 언어와 범위에 출제 가능한 구절이 없어요.</p>':''}</div>`}`}
function labLegacy(v,m){let s=getText(v,testLang())||'';if(m==='write')return `<textarea id="labAnswer" class="field" placeholder="본문을 암송해 입력하세요"></textarea>`;if(m==='reference')return `<div class="verse" style="font-size:16px">${esc(s)}</div><div class="quizmodegrid">${choiceOptions(v).map(x=>`<button class="btn ${labPick===x.id?'':'secondary'}" data-action="labpick" data-pick="${x.id}">${esc(x.ref)}</button>`).join('')}</div>`;let words=labWords(s);let indexes=new Set(words.map((_,i)=>i).sort((a,b)=>hashStr(v.id+':'+quizPos+':'+a)-hashStr(v.id+':'+quizPos+':'+b)).slice(0,Math.max(1,Math.round(words.length*.35))));return `<p class="hint">가려진 단어를 순서대로 입력하세요. 답은 / 로 구분합니다.</p><div class="verse" style="font-size:16px">${words.map((w,i)=>indexes.has(i)?`<span class="blank revealed" style="color:#574025">[ ${i+1} ]</span>`:esc(w)).join(' ')}</div><textarea id="labAnswer" class="field" placeholder="빠진 단어만 / 로 구분해 입력"></textarea><div hidden id="labKey">${esc(JSON.stringify(words.filter((_,i)=>indexes.has(i))))}</div>`}
function labGrade(point){if(labResult!==null)return;let v=quizVerse();labResult=point;labTotal++;if(point>=80)labCorrect++;else{labMistakes.push(v.id);state.quizErrors??={};state.quizErrors[v.id]=(state.quizErrors[v.id]||0)+1}state.tests[v.id]=Math.max(state.tests[v.id]||0,point);state.quizHistory??=[];state.quizHistory.push({id:v.id,mode:labMode(),score:point,date:localDate()});state.quizHistory=state.quizHistory.slice(-500);save();render()}
document.addEventListener('click',e=>{let b=e.target.closest('[data-action]');if(!b)return;let a=b.dataset.action;if(!['labchunk','labundo','labpick','labflip','labself','labstart','labgrade','labnext','labretry'].includes(a))return;e.preventDefault();e.stopImmediatePropagation();let v=quizVerse(),m=labMode();if(a==='labstart'){labStart();return}if(a==='labretry'){testScope=labMistakes.length?'weak':'all';labStart();return}if(a==='labnext'){if(labResult===null&&m!=='flash'&&!confirm('채점하지 않고 넘어갈까요?'))return;if(labResult===null&&m!=='flash')labGrade(0);labNext();return}if(a==='labpick'){labPick=b.dataset.pick;render();return}if(a==='labflip'){labReveal=!labReveal;render();return}if(a==='labself'){if(labResult===null)labGrade(Number(b.dataset.point));return}if(a==='labchunk'){let x=labOrder.find(x=>x.key==b.dataset.i);if(x){x.used=true;x.rank=labOrder.filter(y=>y.used).length}render();return}if(a==='labundo'){let x=labOrder.find(x=>x.key==b.dataset.i);if(x){x.used=false;x.rank=0}render();return}if(a==='labgrade'){if(!v){toast('먼저 시험을 시작해 주세요.');return}let s=getText(v,testLang())||'',ans=document.querySelector('#labAnswer')?.value||'',point=0;if(m==='order'){let chunks=labChunks(s);let arranged=labOrder.filter(x=>x.used).sort((a,b)=>a.rank-b.rank).map(x=>x.text);point=Math.round(100*arranged.filter((x,i)=>x===chunks[i]).length/chunks.length)}else if(m==='truefalse'){if(!labPick){toast('O 또는 X를 선택해 주세요.');return}point=labPick===(window.labTruth?'yes':'no')?100:0}else if(m==='reference'){if(!labPick){toast('성경 위치를 선택해 주세요.');return}point=labPick===v.id?100:0}else if(m==='blank'){let w=JSON.parse(document.querySelector('#labKey')?.textContent||'[]');let a=ans.split('/');point=w.length?Math.round(w.filter((x,i)=>normalize(x)===normalize(a[i])).length/w.length*100):0}else if(m==='keyword'){let k=window.labKeywords||[];point=k.length?Math.round(k.filter(x=>normalize(ans).includes(normalize(x))).length/k.length*100):0}else point=score(ans,s);labGrade(point);}} ,true);
document.addEventListener('change',e=>{if(e.target.id==='labcount'){labOptions.count=e.target.value;quizQueue=[];quizPos=0;labReset();render()}},true);

function render(){let date=new Intl.DateTimeFormat('ko-KR',{dateStyle:'full'}).format(new Date());$('#date').textContent=date;$('#streak').textContent='🔥 '+streak()+'일 연속';document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('active',b.dataset.page===page));$('#view').innerHTML=page==='today'?showToday():page==='library'?showLibrary():page==='test'?showTest():page==='more'?showMore():page==='practice'?showPractice():detailView();if(page==='today')ensure(VERSES[todayIndex()]);if(page==='detail'||page==='practice')ensure(current());if(page==='test'&&quizVerse())ensure(quizVerse());}function navigate(p){if(p==='test'&&testId){testScope=VERSES.find(x=>x.id===testId)?.topic||'today';quizQueue=[testId];quizPos=0}else if(p==='test'){quizQueue=[];quizPos=0;labReset()}page=p;testResult=null;lastAnswer='';reveal=false;blanksRevealed=false;window.scrollTo(0,0);render()}
async function preload(){let button=document.querySelector('[data-action="precache"]');if(button)button.disabled=true;let failed=0;for(let i=0;i<VERSES.length;i++){for(let lang of ['ko']){if(!getText(VERSES[i],lang)){try{await fetchVerse(VERSES[i],lang)}catch{failed++}}}let p=$('#cacheprogress');if(p)p.textContent=`저장 진행: ${i+1}/60구절 (${Object.keys(state.cache).length}/60 한국어)`}toast(failed?`저장 완료. 실패한 항목 ${failed}개는 인터넷 연결을 확인해 주세요.`:'한국어 60구절 저장 완료!');render()}
function downloadFile(name,content,mime){let url=URL.createObjectURL(new Blob([content],{type:mime})),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)}
function csvParse(src,delimiter=','){let rows=[],row=[],field='',quoted=false;src=src.replace(/^\uFEFF/,'');for(let i=0;i<src.length;i++){let c=src[i];if(quoted){if(c==='"'&&src[i+1]==='"'){field+='"';i++}else if(c==='"')quoted=false;else field+=c}else if(c==='"')quoted=true;else if(c===delimiter){row.push(field);field=''}else if(c==='\n'){row.push(field.replace(/\r$/,''));rows.push(row);row=[];field=''}else field+=c}if(field||row.length){row.push(field.replace(/\r$/,''));rows.push(row)}if(quoted)throw Error('CSV 인용부호가 닫히지 않았습니다');return rows}
function parseNiv(source,name=''){let records;if(/\.json$/i.test(name)||source.trimStart().startsWith('{')||source.trimStart().startsWith('[')){let obj=JSON.parse(source);if(obj.version&&obj.version!=='NIV')throw Error('NIV 버전이 아닌 파일입니다');records=Array.isArray(obj)?obj:Array.isArray(obj.verses)?obj.verses:Object.entries(obj).filter(([k])=>/^[A-E](?:[1-9]|1[0-2])$/i.test(k)).map(([id,text])=>({id,text}));}else{let tsv=/\.tsv$/i.test(name)||(!/\.csv$/i.test(name)&&source.includes('\t'));let rows=csvParse(source,tsv?'\t':',');if(rows[0]&&/^(id|구절번호)$/i.test(rows[0][0]?.trim()))rows.shift();records=rows.map(x=>({id:x[0],text:x.length>=3?x.slice(2).join(tsv?'\t':','):x[1]}))}if(!Array.isArray(records))throw Error('구절 목록 형식이 아닙니다');let valid=new Map(),invalid=[],duplicates=[];for(const r of records){let id=String(r.id||'').toUpperCase().replace(/\s/g,''),v=VERSES.find(v=>v.id===id),txt=typeof r.text==='string'?r.text.trim():'';if(!v||!txt){if(id||txt)invalid.push(id||'?');continue}if(valid.has(id))duplicates.push(id);valid.set(id,txt)}if(!valid.size)throw Error('유효한 구절이 없습니다. A1~E12 ID와 본문을 확인하세요');return {valid,invalid,duplicates}}
function applyNiv(content,name){let data=parseNiv(content,name),count=data.valid.size;let explanation=`NIV ${count}개 구절을 등록할까요?\n기존 NIV 본문 중 ID가 같은 구절은 덮어씁니다.\n다른 언어 및 학습 기록은 유지됩니다.`+(data.invalid.length?`\n무효 항목 ${data.invalid.length}개 제외됨`: '')+(data.duplicates.length?`\n중복 ID ${data.duplicates.length}개는 마지막 값 사용`: '');if(!confirm(explanation))return;for(let [id,txt] of data.valid){state.cache[id+'_en']={text:txt,version:'NIV',copyright:'New International Version (NIV) — user-supplied text'}}save();render();toast(`NIV ${count}구절 등록 완료! (${VERSES.filter(v=>getText(v,'en')).length}/60)`)}
function speak(v,lang){let text=getText(v,lang);if(!text||!('speechSynthesis'in window)){toast('음성 읽기를 지원하지 않아요');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text);u.lang=lang==='ko'?'ko-KR':'en-US';u.rate=.82;speechSynthesis.speak(u)}
document.addEventListener('click',async e=>{let b=e.target.closest('[data-page],[data-action]');if(!b)return;if(b.dataset.page){if(b.dataset.page==='test')testId=null;navigate(b.dataset.page);return}let a=b.dataset.action, v=page==='today'?VERSES[todayIndex()]:current();switch(a){case 'nivtemplate':{let rows=['id,reference,text',...VERSES.map(v=>`${v.id},"${v.ref.replaceAll('"','""')}","${(getText(v,'en')||'').replaceAll('"','""')}"`)];downloadFile('malssumharu_NIV_60_template.csv','\uFEFF'+rows.join('\r\n'),'text/csv;charset=utf-8');toast('NIV 템플릿을 저장했어요');break}case 'nivimport':$('#nivfile').click();break;case 'nivpaste':{try{applyNiv($('#nivbulk').value,'text.tsv')}catch(err){toast('등록 실패: '+err.message)}break}case 'saveNiv':{let target=VERSES.find(x=>x.id===b.dataset.id),value=$('#nivEntry')?.value.trim();if(!value){toast('NIV 본문을 입력해 주세요');break}state.cache[cacheKey(target,'en')]={text:value,version:'NIV',copyright:'New International Version (NIV) — user-supplied text'};save();toast('NIV 본문을 저장했어요');render();break}case 'lang':state.language=b.dataset.lang;save();render();break;case 'reload':case 'reloadtest':{let target=page==='test'?(testId?VERSES.find(x=>x.id===testId):VERSES[todayIndex()]):v;delete state.cache[cacheKey(target,'ko')];save();await ensure(target);break}case 'copy':{let s=[v.ref,getText(v,'ko'),getText(v,'en')].filter(Boolean).join('\n\n');try{await navigator.clipboard.writeText(s);toast('구절을 복사했어요')}catch{toast('복사 기능이 제한돼요')}}break;case 'mark':markRead(v);break;case 'speak':speak(v,b.dataset.lang);break;case 'group':group=b.dataset.topic;search='';render();break;case 'select':selected=VERSES.findIndex(x=>x.id===b.dataset.id);navigate('detail');break;case 'practice':selected=VERSES.findIndex(x=>x.id===b.dataset.id);navigate('practice');break;case 'test':testId=b.dataset.id;navigate('test');break;case 'back':navigate('library');break;case 'allreveal':blanksRevealed=!blanksRevealed;render();break;case 'shuffleblanks':practiceNonce++;blankAnswers={};blankCheck=false;blanksRevealed=false;render();break;case 'practicemode':practiceMode=b.dataset.value;blankAnswers={};blankCheck=false;render();break;case 'checkblanks':{document.querySelectorAll('[data-blank]').forEach(x=>blankAnswers[x.dataset.blank]=x.value);blankCheck=true;render();break}case 'testmode':testId=null;testMode=b.dataset.value;practiceLevel=2;practiceMode='type';practiceNonce++;quizQueue=[];quizPos=0;labReset();render();break;case 'startquiz':testId=null;beginQuiz();render();break;case 'choose':quizChoice=b.dataset.id;render();break;case 'gradequiz':{let q=quizVerse();if(!q)break;if(testMode==='reference'){if(!quizChoice){toast('정답을 선택해 주세요');break}testResult=quizChoice===q.id?100:0}else if(testMode==='blank'){document.querySelectorAll('[data-blank]').forEach(x=>blankAnswers[x.dataset.blank]=x.value);let parts=practiceParts(q).filter(p=>p.hidden);if(!parts.length){toast('빈칸이 없습니다');break}testResult=Math.round(parts.filter(p=>normalize(blankAnswers[p.index])===normalize(p.word)).length/parts.length*100);blankCheck=true}else{let ans=$('#answer')?.value||'';if(!ans.trim()){toast('답안을 입력해 주세요');break}lastAnswer=ans;testResult=score(ans,getText(q,testLang()))}state.tests[q.id]=Math.max(state.tests[q.id]||0,testResult);save();reveal=true;render();break}case 'nextquiz':{if(quizPos+1>=quizQueue.length)beginQuiz();else quizPos++;testResult=null;lastAnswer='';quizChoice=null;blankAnswers={};blankCheck=false;reveal=false;practiceNonce++;render();break}case 'reveal':b.classList.toggle('revealed');break;case 'testlang':state.language=b.dataset.lang;save();quizQueue=[];quizPos=0;labReset();render();break;case 'peek':reveal=!reveal;{let val=$('#answer')?.value;render();if(val&&$('#answer'))$('#answer').value=val}break;case 'grade':{let target=testId?VERSES.find(x=>x.id===testId):VERSES[todayIndex()],lang=state.language==='en'?'en':'ko';let answer=$('#answer')?.value||'';if(!answer.trim()){toast('암송한 말씀을 입력해 주세요');break}lastAnswer=answer;testResult=score(answer,getText(target,lang));state.tests[target.id]=Math.max(state.tests[target.id]||0,testResult);save();reveal=true;render();break}case 'nexttest':{let cur=testId?VERSES.findIndex(x=>x.id===testId):todayIndex();testId=VERSES[(cur+1)%60].id;navigate('test');break}case 'export':{let blob=new Blob([JSON.stringify({type:'verse60',version:1,state},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='malssumharu_backup_'+localDate()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);break}case 'import':$('#importfile').click();break;case 'precache':await preload();break;}});
document.addEventListener('change',async e=>{if(e.target.id==='start'){state.start=e.target.value||localDate();save();render()}if(e.target.id==='nivfile'){try{if(e.target.files?.[0])applyNiv(await e.target.files[0].text(),e.target.files[0].name)}catch(err){toast('NIV 파일 오류: '+err.message)}finally{e.target.value=''}}if(e.target.id==='importfile'){try{let j=JSON.parse(await e.target.files[0].text());if(j.type!=='verse60'||typeof j.state!=='object')throw Error('잘못된 백업 형식');if(!confirm('현재 저장된 기록을 백업 파일로 교체할까요?'))return;state=j.state;save();navigate('today');toast('백업을 복원했어요')}catch{toast('올바른 JSON 백업 파일이 아니에요')}finally{e.target.value=''}}});document.addEventListener('change',e=>{if(e.target.id==='practiceLevel'){practiceLevel=Number(e.target.value);blankAnswers={};blankCheck=false;render()}if(e.target.id==='testscope'){testScope=e.target.value;testId=null;quizQueue=[];quizPos=0;labReset();render()}});document.addEventListener('input',e=>{if(e.target.matches('[data-blank]')){blankAnswers[e.target.dataset.blank]=e.target.value;return}if(e.target.id==='search'){let pos=e.target.selectionStart;search=e.target.value;render();let inp=$('#search');inp?.focus();inp?.setSelectionRange(pos,pos)}});
render();setInterval(()=>{if($('#date')?.dataset.day!==localDate()){ $('#date').dataset.day=localDate();render()}},60000);
</script></body></html>
